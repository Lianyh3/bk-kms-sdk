name: Java SDK

on:
  pull_request:
    paths:
      - "java/**"
      - ".github/workflows/java.yml"
      - ".github/workflows/java-release.yml"
  push:
    paths:
      - "java/**"
      - ".github/workflows/java.yml"
      - ".github/workflows/java-release.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21"]
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - name: Build, test and package (with sources/javadoc, no signing)
        run: mvn -B -ntp -Prelease -Dgpg.skip=true clean install
      - name: Build example
        run: mvn -B -ntp -f examples/decrypt/pom.xml clean package

  standard-crypto:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        java-version: ["17", "21"]
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: mvn -B -ntp clean verify
